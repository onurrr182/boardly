<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background-color: #f4f4f5; }
  .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; }
  .header { background: linear-gradient(135deg, #4F46E5, #7C3AED); padding: 40px 20px; text-align: center; color: white; }
  .header h1 { margin: 0; font-size: 28px; font-family: 'Outfit', sans-serif; }
  .content { padding: 30px 20px; text-align: center; color: #1E293B; }
  .btn { display: inline-block; padding: 12px 24px; background-color: #4F46E5; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 20px; }
  .footer { padding: 20px; text-align: center; color: #64748B; font-size: 12px; border-top: 1px solid #E2E8F0; }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>A Special Board for You!</h1>
      <p>Someone created a Boardly to celebrate you.</p>
    </div>
    <div class="content">
      <h2>You've received a new board!</h2>
      <p>Click the button below to view all the wonderful messages, memories, and photos people have shared.</p>
      <a href="#" class="btn">View Your Board</a>
    </div>
    <div class="footer">
      &copy; 2026 Boardly. "Every story deserves a board."
    </div>
  </div>
</body>
</html>
